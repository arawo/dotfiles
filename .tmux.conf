set -g mouse on
set -g default-terminal "xterm-256color"
set -as terminal-overrides ',*:Tc'

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── アクティビティ・ベル監視 ────────────────────────────────
# monitor-activity は頻度が高すぎるため無効化
set -g monitor-activity off
set -g monitor-bell on
set -g monitor-silence 10    # 10秒無音 = 処理完了の合図
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off    # tmux内メッセージは出さず通知スクリプトに任せる

# 無音検知時（処理完了）: macOS通知
set-hook -g alert-silence 'run-shell "osascript -e \"display notification \\\"処理が完了しました\\\" with title \\\"tmux: #{window_name}\\\"\" &"'

# ベル時（入力待ち）: macOS通知
set-hook -g alert-bell 'run-shell "osascript -e \"display notification \\\"入力を待っています\\\" with title \\\"tmux: #{window_name}\\\" subtitle \\\"⚡ 要確認\\\"\" &"'

# ── ウィンドウリストのスタイル ──────────────────────────────
# 通常ウィンドウ
set -g window-status-format         " #I:#W "
# ベルありウィンドウ（⚡ マーク付き・赤）
set -g window-status-activity-style "fg=colour130,bold"
set -g window-status-bell-style     "fg=red,bold"
# フォーマット（無音=完了: ✓ / ベル=要確認: ⚡）
set -g window-status-format         " #I:#W#{?window_silence_flag, ✓,}#{?window_bell_flag, ⚡,} "
set -g window-status-current-format " #I:#W#{?window_bell_flag, ⚡,} "
